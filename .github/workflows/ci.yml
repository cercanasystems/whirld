name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # Python 3.13.7 has setup-python builds for 24.04, not newer runner images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
          cache: pip
      - name: Install development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt -e .
          .venv/bin/python -m pip check
      - name: Formatting and lint
        run: |
          .venv/bin/black --check src tests scripts examples
          .venv/bin/ruff check src tests scripts examples
      - name: Package typing
        run: .venv/bin/mypy src/whirld examples
      - name: Bundled registry validation
        run: .venv/bin/python scripts/check_registry.py --validate-only src/whirld/registry_data/models/*.yaml
      - name: Regression suite and coverage
        run: .venv/bin/python -m pytest --cov=whirld --cov=examples --cov-fail-under=80
  base-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: Fresh package install and isolated smoke test
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt .
          .venv/bin/python -m pip check
          PATH="$PWD/.venv/bin:$PATH" WHIRLD_HOME="$RUNNER_TEMP/whirld-smoke" .venv/bin/python scripts/clean_room_test.py
  starter-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WHIRLD_HOME: ${{ runner.temp }}/whirld-starter-models
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - uses: actions/cache@v4
        with:
          path: ${{ env.WHIRLD_HOME }}
          key: starter-rn50-${{ runner.os }}-${{ hashFiles('src/whirld/registry_data/models/remoteclip-rn50.yaml') }}
      - name: Install only the tested CPU starter runtime
        run: |
          python -m pip install uv==0.11.20
          uv venv --python 3.13.7 .venv
          uv pip install --python .venv/bin/python --torch-backend cpu -r requirements-quickstart.txt '.[remoteclip]'
          uv pip check --python .venv/bin/python
      - name: Run installed diagnostics and real demo outside the checkout
        run: |
          starter_cli="$PWD/.venv/bin/whirld"
          starter_python="$PWD/.venv/bin/python"
          mkdir -p "$RUNNER_TEMP/whirld-starter-run"
          cd "$RUNNER_TEMP/whirld-starter-run"
          "$starter_cli" doctor --json > doctor.json
          "$starter_cli" demo --output result
          "$starter_python" - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import whirld
          assert not Path(whirld.__file__).is_relative_to(Path(os.environ['GITHUB_WORKSPACE']) / 'src')
          for name in ('pytest', 'terratorch', 'torchgeo', 'fastapi', 'black', 'ruff'):
              assert importlib.util.find_spec(name) is None, name
          report = json.loads(Path('result/report.json').read_text())
          assert report['model'] == 'remoteclip-rn50' and report['feature_count'] == 4
          assert report['device'] == 'cpu'
          assert Path('result/preview.html').is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starter-linux-result
          path: ${{ runner.temp }}/whirld-starter-run
          retention-days: 3
